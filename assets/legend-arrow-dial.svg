<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <title>Universal Legend arrow dial</title>
  <desc>Transparent token overlay. Arrow points up; rotate around 50,50. Scale the square canvas to the token diameter.</desc>
  <defs>
    <linearGradient id="metal" x1="40" y1="0" x2="60" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#806027"/>
      <stop offset=".45" stop-color="#fff0b4"/>
      <stop offset=".6" stop-color="#d9b461"/>
      <stop offset="1" stop-color="#8e692c"/>
    </linearGradient>
  </defs>
  <!-- The hub, not the visible artwork bounds, is the rotation origin. -->
  <path d="M50 7 62 26 54 23 54 49 46 49 46 23 38 26Z" fill="url(#metal)" stroke="#211b12" stroke-width="2" stroke-linejoin="round"/>
  <path d="M50 11V43" stroke="#fff1bc" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="8" fill="url(#metal)" stroke="#211b12" stroke-width="2"/>
  <circle cx="50" cy="50" r="3" fill="#302b23" stroke="#f5dda0"/>
</svg>
